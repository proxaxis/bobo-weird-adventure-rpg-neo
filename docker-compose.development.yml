name: bobo_weird_adventure_rpg_development

services:
  # Redis
  redis:
    image: redis:7-alpine
    container_name: bobo_weird_adventure_rpg_redis_development
    volumes:
      - nv_redis:/data

  # Center Server (hosted by Game Organizer)
  router:
    build:
      context: ./router
      dockerfile: Dockerfile
    image: bobo-weird-adventure-rpg-router:development
    container_name: bobo_weird_adventure_rpg_router_development
    env_file:
      - .env.development
    volumes:
      - ./router/app:/app
    ports:
      - "8788:8788"
    depends_on:
      - redis

  # Client Application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: bobo-weird-adventure-rpg-client:development
    container_name: bobo_weird_adventure_rpg_client_development
    env_file:
      - .env.development
    volumes:
      - ./client/app:/app
      - /app/node_modules
    ports:
      - "8010:8010"

  # Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: bobo-weird-adventure-rpg-server:development
    container_name: bobo_weird_adventure_rpg_server_development
    env_file:
      - .env.development
    volumes:
      - ./server/app:/app
      - ./server/data:/app/data
    ports:
      - "8787:8787"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - router

  # Oparation Agent
  operationer:
    build:
      context: ./operationer
      dockerfile: Dockerfile
    image: bobo-weird-adventure-rpg-operationer:latest
    container_name: bobo_weird_adventure_rpg_operationer
    shm_size: '2gb'
    env_file:
      - .env.development
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
    command: sleep infinity

volumes:
  nv_redis: